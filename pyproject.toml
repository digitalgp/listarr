[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "listarr"
version = "0.1.0"
description = "Synchronize Radarr and Sonarr libraries to private MDBList lists"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "digitalgp" }]
keywords = ["radarr", "sonarr", "mdblist", "lists", "sync"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
listarr = "listarr.cli:main"

[project.urls]
Homepage = "https://github.com/digitalgp/listarr"
Repository = "https://github.com/digitalgp/listarr"
Issues = "https://github.com/digitalgp/listarr/issues"
"Original project" = "https://github.com/zakkarry/retraktarr"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
